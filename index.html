                            "text": "Por norma general, el lunes suele ser el día más barato para repostar en España. Los precios tienden a subir hacia el fin de semana (especialmente viernes y sábados) debido al aumento de la demanda y los desplazamientos."
                        }

                        "@type": "Question",
                        "name": "¿Es de peor calidad el combustible de las gasolineras low cost?",
                        "acceptedAnswer": {
                            "@type": "Answer",
                            "text": "No. Todo el carburante vendido en España proviene de los mismos depósitos centrales (Exolum/CLH) y cumple con los estándares legales de calidad. Las marcas tradicionales añaden aditivos propios, mientras que las gasolineras low cost abaratan costes automatizando estaciones y ajustando sus márgenes comerciales."
                        }
                    },

                        "acceptedAnswer": {
                            "@type": "Answer",
                            "text": "La diferencia radica en el porcentaje de bioetanol mezclado: la E5 contiene hasta un 5% de etanol y la E10 hasta un 10%. La gran mayoría de coches matriculados a partir del año 2000 pueden usar Gasolina 95 E10 sin problemas."
